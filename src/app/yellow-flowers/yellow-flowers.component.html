<div class="flowers-container">
    <div class="message">
      <h1>{{ message }}</h1>
      <h2>{{ subMessage }}</h2>
      <div class="heart-container">
        <div class="heart" [class.beat]="isHeartBeating">❤️</div>
      </div>
      <p class="special-note">{{ specialNote }}</p>
    </div>
    
    <div class="flowers-field">
      <div *ngFor="let flower of flowers; let i = index" class="flower" [style.animationDelay]="i*0.2 + 's'">
        <div class="center"></div>
        <div class="petals p1"></div>
        <div class="petals p2"></div>
        <div class="petals p3"></div>
        <div class="petals p4"></div>
        <div class="petals p5"></div>
        <div class="petals p6"></div>
        <div class="petals p7"></div>
        <div class="petals p8"></div>
        <div class="stem">
          <div class="leaf left"></div>
          <div class="leaf right"></div>
        </div>
      </div>
    </div>
  
    <div class="falling-petals">
      <div *ngFor="let i of fallingPetals; let index = index" class="falling-petal" 
           [style.left]="(index * 10) + '%'" 
           [style.animationDelay]="index + 's'"></div>
    </div>
  </div>
